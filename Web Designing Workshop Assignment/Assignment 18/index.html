<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 18 - ABC College Admission 2026</title>
    <style>
        body {
            font-family: Georgia, serif;
            margin: 0;
            padding: 0;
        }
        header, footer {
            background-color: #1a237e;
            color: white;
            text-align: center;
            padding: 15px;
        }
        main {
            max-width: 650px;
            margin: 20px auto;
            padding: 0 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #e8eaf6;
            text-align: center;
        }
        fieldset {
            padding: 15px;
        }
    </style>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <section>
            <h2>Courses and Fees</h2>
            <table>
                <caption>Available Courses</caption>
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Seats</th>
                        <th>Fees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>&#8377;90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>&#8377;45,000</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <section>
            <form action="#" method="post">
                <fieldset>
                    <legend>Application Form</legend>

                    <p>
                        <label for="name">Name:</label><br>
                        <input type="text" id="name" name="name" size="35" required>
                    </p>

                    <p>
                        <label for="email">Email:</label><br>
                        <input type="email" id="email" name="email" size="35" required>
                    </p>

                    <p>
                        <label for="course">Course:</label><br>
                        <select id="course" name="course" required>
                            <option value="B.Tech CSE">B.Tech CSE</option>
                            <option value="BCA">BCA</option>
                        </select>
                    </p>

                    <p>
                        <label for="statement">Statement:</label><br>
                        <textarea id="statement" name="statement" rows="4" cols="60" required></textarea>
                    </p>

                    <p>
                        <button type="submit">Apply</button>
                    </p>
                </fieldset>
            </form>
        </section>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>
</body>
</html>
